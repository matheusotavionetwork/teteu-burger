['h','Teteu Cheddar','Blend 150g, muito cheddar e crispy de cebola.',['Pão brioche','Blend 150g','Cheddar','Crispy de cebola'],34,0,'🧀',0],

['a','Batata da Casa','Porção crocante temperada.',['Batata','Sal e ervas'],16,0,'🍟',0],

['a','Onion Rings','Anéis de cebola empanados.',['Cebola','Empanado'],18,0,'🧅',0],

['b','Coca-Cola','Lata 350ml.',[],6,0,'🥤',0],['b','Coca-Cola Zero','Lata 350ml.',[],6,0,'🥤',0],['b','Guaraná','Lata 350ml.',[],6,0,'🥤',0],['b','Água','Garrafa 500ml.',[],4,0,'💧',0],['b','Suco','Copo 400ml, sabor do dia.',[],9,0,'🍊',0]];

for(const[dd,mm]of[[d,m],[(d+6)%7,m+1440]]){const h=S.cfg.hours[dd];if(h){let a=tm(h[0]),b=tm(h[1]);if(b<=a)b+=1440;if(mm>=a&&mm<b)return{o:1,t:h[1]}}}
for(let i=0;i<8;i++){const dd=(d+i)%7,h=S.cfg.hours[dd];if(h&&(i>0||m<tm(h[0])))return{o:0,t:(i==0?'hoje':i==1?'amanhã':D[dd])+' às '+h[0]}}return{o:0,t:'em breve'}}

function modal(pid){const p=S.prods.find(x=>x.id==pid);if(!p||!p.on)return;M={p,qty:1,add:[],rm:[],obs:''};const ad=['h','c'].includes(p.cat);

function mup(){const u=(M.p.promo||M.p.price)+M.add.reduce((s,n)=>s+S.adds.find(a=>a.n==n).p,0);$('#mp').textContent=R(u);$('#mt').textContent=R(u*M.qty);$('#mq').textContent=M.qty}
function cart(){const c=calc(),f=S.form,o=openInfo();
const items=S.cart.map((i,x)=>`<div class="it"><div><b>${esc(i.name)}</b><small>${[...i.add.map(a=>'+ '+a),...i.rm.map(r=>'sem '+r)].map(esc).join(', ')}${i.obs?'<br>Obs: '+esc(i.obs):''}</small><b style="color:var(--gold)">${R(uni(i)*i.qty)}</b></div><div class="q"><button data-a="cq" data-x="${x}" data-d="-1">−</button>${i.qty}<button data-a="cq" data-x="${x}" data-d="1">+</button><button data-a="cq" data-x="${x}" data-d="-99">🗑</button></div></div>`).join('');
const inp=(k,ph,cl='')=>`<input class="in ${cl}" data-f="${k}" placeholder="${ph}" value="${esc(f[k]||'')}">`;
$('#ov').innerHTML=`<div class="ov" data-a="closeov"><div class="sh"><div style="display:flex;justify-content:space-between"><h3>Seu pedido</h3><button class="btn s g" data-a="close">Fechar</button></div>
${S.cart.length?items+`<p><button class="btn s g" data-a="clear">Esvaziar carrinho</button></p>
<div class="seg"><button class="${f.type=='d'?'on':''}" data-a="type" data-t="d">🚗 Entrega</button><button class="${f.type=='p'?'on':''}" data-a="type" data-t="p">🏪 Retirar no local</button></div>
${inp('name','Seu nome')}${inp('phone','Telefone / WhatsApp')}
${f.type=='d'?`<div class="g2">${inp('cep','CEP')}${inp('num','Número')}</div>${inp('rua','Rua')}${inp('comp','Complemento')}<datalist id="bl">${Object.keys(S.cfg.fees).map(k=>`<option>${esc(k)}</option>`).join('')}</datalist><input class="in" list="bl" data-f="bairro" data-r="1" placeholder="Bairro" value="${esc(f.bairro||'')}">${inp('cidade','Cidade')}${inp('ref','Ponto de referência')}
${c.conf&&f.bairro?'<div class="wn">Região não cadastrada: a taxa será confirmada pela hamburgueria.</div>':''}`:`<div class="wn">Retire em: ${esc(S.cfg.addr)}<br>Tempo estimado: ${S.cfg.prep}</div>`}
<h3 style="font-size:18px;margin-top:8px">Pagamento</h3><div class="seg">${[['pix','Pix'],['din','Dinheiro'],['car',f.type=='d'?'Cartão na entrega':'Cartão na retirada']].map(p=>`<button class="${f.pay==p[0]?'on':''}" data-a="pay" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
${f.pay=='din'?`<label class="o"><span>Precisa de troco?</span><input type="checkbox" data-f="troco" data-r="1" ${f.troco?'checked':''}></label>${f.troco?inp('trocoV','Troco para quanto?'):''}`:''}
<div style="display:flex;gap:8px"><input class="in" data-f="cpi" placeholder="Possui um cupom?" value="${esc(f.cpi||'')}"><button class="btn s" data-a="coupon">Aplicar</button></div>
<textarea class="in" rows="2" data-f="gobs" placeholder="Observação geral do pedido">${esc(f.gobs||'')}</textarea>
<div class="tot"><span>Subtotal</span><span>${R(c.sub)}</span></div><div class="tot"><span>Taxa de entrega</span><span>${f.type=='p'?'—':c.conf?'a confirmar':c.fee?R(c.fee):'Grátis'}</span></div>${c.disc?`<div class="tot"><span>Desconto (${esc(c.cp.code)})</span><span>− ${R(c.disc)}</span></div>`:''}<div class="tot f"><span>Total</span><span>${R(c.total)}</span></div>
${o.o?'':`<div class="wn">Loja fechada. Abre ${o.t}. Você pode enviar o pedido para ser atendido na abertura.</div>`}
${f.pay=='pix'?'<div class="wn">Pix online ainda não está conectado a um gateway. O pedido será registrado como “aguardando pagamento” e o Pix é combinado pelo WhatsApp.</div>':''}
<button class="btn" style="width:100%;margin-top:8px" data-a="confirm">Confirmar pedido</button>`:'<p style="color:var(--mut)">Seu carrinho está vazio. Escolha um hambúrguer no cardápio.</p><button class="btn" data-a="menu">Ver cardápio</button>'}</div></div>`}
function confirmOrder(){const f=S.form,c=calc();
if(!f.name?.trim()||!f.phone?.trim())return toast('Informe nome e telefone');
if(f.type=='d'&&(!f.rua||!f.num||!f.bairro||!f.cidade))return toast('Complete o endereço');
if(c.sub<S.cfg.min)return toast('Pedido mínimo: '+R(S.cfg.min));
if(c.cp)c.cp.used++;
const o={id:'TB-'+(++S.seq),t:Date.now(),name:f.name,phone:f.phone,type:f.type,addr:f.type=='d'?`${f.rua}, ${f.num}${f.comp?' - '+f.comp:''}\n${f.bairro}\n${f.cidade}${f.ref?'\nRef.: '+f.ref:''}`:'Retirada',pay:f.pay=='pix'?'Pix':f.pay=='din'?'Dinheiro'+(f.troco?' (troco p/ '+(f.trocoV||'?')+')':''):f.type=='d'?'Cartão na entrega':'Cartão na retirada',obs:f.gobs||'',items:JSON.parse(JSON.stringify(S.cart)).map(i=>({...i,u:uni(i)})),sub:c.sub,fee:c.fee,disc:c.disc,total:c.total,st:'novo',feeConf:c.conf};
S.orders.push(o);S.cart=[];S.form.cp='';S.form.cpi='';save();stat();
const L=o.items.map(i=>`${i.qty}x ${i.name} — ${R(i.u*i.qty)}`+[...i.add.map(a=>'\n   + '+a),...i.rm.map(r=>'\n   - sem '+r)].join('')+(i.obs?'\n   Obs: '+i.obs:'')).join('\n');
const msg=`🍔 NOVO PEDIDO — TETEU BURGER (${o.id})\n\n👤 Cliente: ${o.name}\n📞 ${o.phone}\n\n📦 Pedido:\n${L}\n\n💰 Subtotal: ${R(o.sub)}\n🚚 Entrega: ${o.type=='p'?'Retirada':o.feeConf?'a confirmar':R(o.fee)}${o.disc?`\n🏷️ Desconto: -${R(o.disc)}`:''}\n💵 Total: ${R(o.total)}\n\n📍 Endereço:\n${o.addr}\n\n💳 Pagamento: ${o.pay}${o.pay=='Pix'?' (aguardando)':''}${o.obs?'\n\n📝 Observação:\n'+o.obs:''}`;
$('#ov').innerHTML=`<div class="ov"><div class="sh" style="text-align:center"><div style="font-size:64px">✅</div><h3>Pedido ${o.id} registrado</h3><p style="color:var(--mut)">Envie para a hamburgueria pelo WhatsApp para confirmar. Total: <b style="color:var(--gold)">${R(o.total)}</b></p><a class="btn" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${S.cfg.wa}?text=${encodeURIComponent(msg)}">Enviar pelo WhatsApp</a><p><button class="btn s g" data-a="close">Fechar</button></p><p style="color:var(--mut);font-size:12px">Demonstração: o pedido está salvo só neste navegador.</p></div></div>`}
const A={
top(){close();location.hash='';$('#adm').hidden=true;scrollTo(0,0)},menu(){close();($('#menu')||{scrollIntoView(){}}).scrollIntoView()},cart,close,
closeov(d,e){if(e.target.classList.contains('ov'))close()},tab(d){tab=d.id;home();$('#menu').scrollIntoView()},open(d){modal(+d.id)},
mq(d){M.qty=Math.max(1,M.qty+ +d.d);mup()},
addcart(){const p=M.p;S.cart.push({pid:p.id,name:p.name,base:p.promo||p.price,qty:M.qty,add:M.add,rm:M.rm,obs:M.obs});save();close();stat();toast('Adicionado ao carrinho')},
cq(d){const i=S.cart[+d.x];i.qty+= +d.d;if(i.qty<1)S.cart.splice(+d.x,1);save();stat();cart()},clear(){S.cart=[];save();stat();cart()},
type(d){S.form.type=d.t;save();cart()},pay(d){S.form.pay=d.p;save();cart()},
coupon(){const c=calc();const cp=S.coupons.find(x=>x.code==(S.form.cpi||'').trim().toUpperCase());if(cp&&cOk(cp,c.sub)){S.form.cp=cp.code;toast('Cupom aplicado')}else{S.form.cp='';toast('Cupom inválido ou fora das regras')}save();cart()},confirm:confirmOrder};
function close(){$('#ov').innerHTML=''}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset,e);const b=e.target.closest('[data-x2]');if(b)AD[b.dataset.x2]?.(b.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m){if(t.dataset.m=='obs')M.obs=t.value;else{const l=M[t.dataset.m];t.checked?l.push(t.value):l.splice(l.indexOf(t.value),1);mup()}}
if(t.dataset.f){S.form[t.dataset.f]=t.type=='checkbox'?t.checked:t.value;save();if(t.dataset.r)cart()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f=='bairro')cart();if(t.dataset.ad)AD.set(t)});
/* ADMIN (demo: sem segurança real — produção exige backend) */
let at='dash',auth=false;
const ST=[['novo','🔔 Novos'],['prep','👨‍🍳 Em preparo'],['env','🛵 Saiu para entrega'],['fim','✅ Concluídos']];
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function adm(){const el=$('#adm');el.hidden=false;
if(!auth){el.innerHTML=`<div class="w" style="max-width:380px;padding-top:80px"><div class="logo"><b>Teteu</b> <i>Burger</i></div><h2 style="margin-top:20px">Painel da loja</h2><input class="in" id="pw" type="password" placeholder="Senha de demonstração: admin123"><button class="btn" style="width:100%" data-x2="login">Entrar</button><div class="wn">Login de demonstração feito no navegador, sem proteção real. Em produção o login, o hash de senha e as funções ficam no servidor.</div><button class="btn s g" data-a="top">Voltar ao site</button></div>`;return}
const tabs=[['dash','Painel'],['ped','Pedidos'],['card','Cardápio'],['cfg','Configurações']];
el.innerHTML=`<div class="at">${tabs.map(t=>`<button class="${at==t[0]?'on':''}" data-x2="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}<button data-a="top">Sair</button></div><div class="w" style="padding-top:14px">${view()}</div>`}
function view(){const O=S.orders,today=O.filter(o=>new Date(o.t).toDateString()==new Date().toDateString());
if(at=='dash'){const rev=today.reduce((s,o)=>s+o.total,0),cnt=k=>O.filter(o=>o.st==k).length;
const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return{l:D[d.getDay()].slice(0,3),v:O.filter(o=>new Date(o.t).toDateString()==d.toDateString()).reduce((s,o)=>s+o.total,0)}}),mx=Math.max(1,...days.map(d=>d.v));
return`<h2>Painel</h2><div class="kp"><div>Pedidos hoje<b>${today.length}</b></div><div>Faturamento<b>${R(rev)}</b></div><div>Pendentes<b>${cnt('novo')}</b></div><div>Em preparo<b>${cnt('prep')}</b></div><div>Enviados<b>${cnt('env')}</b></div><div>Concluídos<b>${cnt('fim')}</b></div><div>Ticket médio<b>${R(today.length?rev/today.length:0)}</b></div></div><h3 style="margin:10px 0">Vendas (7 dias)</h3><div class="bars" style="margin-bottom:26px">${days.map(d=>`<div style="height:${d.v/mx*100}%"><small>${d.l}</small></div>`).join('')}</div>`}
if(at=='ped')return`<h2>Pedidos</h2><div class="kb">${ST.map((s,i)=>`<div class="col"><h3>${s[1]}</h3>${O.filter(o=>o.st==s[0]).reverse().map(o=>`<div class="oc ${o.isNew?'new':''}"><b>${o.id}</b> · ${new Date(o.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}<br>${esc(o.name)} · ${esc(o.phone)}<br>${o.items.map(x=>x.qty+'x '+esc(x.name)).join(', ')}<br><b>${R(o.total)}</b> · ${esc(o.pay)}<br><small style="color:var(--mut)">${esc(o.addr).replace(/\n/g,'<br>')}${o.obs?'<br>Obs: '+esc(o.obs):''}</small><div style="margin-top:6px;display:flex;gap:6px">${i?`<button class="btn s g" data-x2="mv" data-id="${o.id}" data-s="${ST[i-1][0]}">◀</button>`:''}${i<3?`<button class="btn s" data-x2="mv" data-id="${o.id}" data-s="${ST[i+1][0]}">Avançar ▶</button>`:''}</div></div>`).join('')||'<small style="color:var(--mut)">Vazio</small>'}</div>`).join('')}</div>`;
if(at=='card')return`<h2>Cardápio</h2><div style="overflow-x:auto"><table><tr><td>Produto</td><td>Preço</td><td>Promo</td><td>Ativo</td><td>Top</td><td></td></tr>${S.prods.map(p=>`<tr><td>${p.emo} ${esc(p.name)}</td><td><input class="in" type="number" step="0.5" data-ad="price" data-id="${p.id}" value="${p.price}"></td><td><input class="in" type="number" step="0.5" data-ad="promo" data-id="${p.id}" value="${p.promo}"></td><td><input type="checkbox" data-ad="on" data-id="${p.id}" ${p.on?'checked':''}></td><td><input type="checkbox" data-ad="best" data-id="${p.id}" ${p.best?'checked':''}></td><td><button class="btn s g" data-x2="del" data-id="${p.id}">Excluir</button></td></tr>`).join('')}</table></div>
<h3 style="margin:16px 0 6px">Novo produto</h3><div class="g2"><input class="in" id="np" placeholder="Nome"><input class="in" id="npp" type="number" placeholder="Preço"></div><select class="in" id="npc">${S.cats.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select><button class="btn s" data-x2="addp">Criar produto</button>
<h3 style="margin:16px 0 6px">Categorias</h3><div style="display:flex;gap:8px"><input class="in" id="nc" placeholder="Nova categoria"><button class="btn s" data-x2="addc">Criar</button></div>
<h3 style="margin:16px 0 6px">Adicionais</h3>${S.adds.map(a=>`<div class="tot"><span>${esc(a.n)}</span><span>${R(a.p)}</span></div>`).join('')}<div class="g2"><input class="in" id="na" placeholder="Nome"><input class="in" id="nap" type="number" placeholder="Preço"></div><button class="btn s" data-x2="adda">Criar adicional</button>`;
const c=S.cfg,fld=(k,l,t='text')=>`<label>${l}<input class="in" type="${t}" data-ad="cfg" data-k="${k}" value="${esc(c[k])}"></label>`;
return`<h2>Configurações</h2>${fld('addr','Endereço')}${fld('wa','WhatsApp (55DDDNÚMERO)')}${fld('insta','Instagram')}${fld('prep','Tempo de retirada')}${fld('dprep','Tempo de entrega')}${fld('min','Pedido mínimo (R$)','number')}${fld('free','Frete grátis acima de (R$)','number')}${fld('radius','Raio máximo (km) — validar no servidor com o CEP','number')}
<h3 style="margin:14px 0 6px">Bairro → taxa de entrega</h3>${Object.entries(c.fees).map(([k,v])=>`<div class="tot"><span>${esc(k)}</span><span>${R(v)} <button class="btn s g" data-x2="delf" data-k="${esc(k)}">✕</button></span></div>`).join('')}<div class="g2"><input class="in" id="fb" placeholder="Bairro"><input class="in" id="fv" type="number" placeholder="Taxa"></div><button class="btn s" data-x2="addf">Salvar taxa</button>
<h3 style="margin:14px 0 6px">Horários por dia</h3>${c.hours.map((h,i)=>`<div class="g2"><span>${D[i]}</span><span><input class="in" style="width:45%" data-ad="h" data-i="${i}" data-j="0" value="${h?h[0]:''}" placeholder="fechado"> <input class="in" style="width:45%" data-ad="h" data-i="${i}" data-j="1" value="${h?h[1]:''}" placeholder="fechado"></span></div>`).join('')}
<h3 style="margin:14px 0 6px">Cupons</h3>${S.coupons.map((p,i)=>`<div class="tot"><span>${esc(p.code)} · ${p.pct?p.pct+'%':R(p.fix)} · mín ${R(p.min)} · ${p.used}/${p.limit||'∞'}</span><span><input type="checkbox" data-ad="cpon" data-i="${i}" ${p.on?'checked':''}></span></div>`).join('')}
<div class="g2"><input class="in" id="cc" placeholder="Código"><input class="in" id="cpc" type="number" placeholder="% desconto"></div><div class="g2"><input class="in" id="cf" type="number" placeholder="ou R$ fixo"><input class="in" id="cm" type="number" placeholder="Pedido mín."></div><div class="g2"><input class="in" id="ci" type="date"><input class="in" id="ct" type="date"></div><input class="in" id="cl" type="number" placeholder="Limite de usos"><button class="btn s" data-x2="addcp">Criar cupom</button>
<h3 style="margin:18px 0 6px">Para ativar em produção</h3><div class="box"><ul style="font-size:14px;color:var(--mut)"><li>Backend + banco: servidor com API, banco de dados e pedidos com ID único</li><li>Login admin: ADMIN_EMAIL, senha com hash, JWT_SECRET</li><li>Pix: PIX_GATEWAY (Mercado Pago/Stripe), GATEWAY_TOKEN, WEBHOOK_SECRET</li><li>Preço recalculado no servidor antes de confirmar</li><li>Aviso ao cliente: WhatsApp Business API (WA_API_TOKEN)</li></ul></div>`}
const AD={login(){if($('#pw').value=='admin123'){auth=true;adm()}else toast('Senha incorreta')},tab(d){at=d.t;adm()},
mv(d){S.orders.find(o=>o.id==d.id).st=d.s;save();adm()},
del(d){if(confirm('Excluir produto?')){S.prods=S.prods.filter(p=>p.id!=d.id);save();adm()}},
addp(){const n=$('#np').value.trim(),p=+$('#npp').value;if(!n||!p)return toast('Informe nome e preço');S.prods.push({id:Date.now(),cat:$('#npc').value,name:n,desc:'Descrição do produto',ing:[],price:p,promo:0,emo:'🍔',best:0,on:true});save();adm()},
addc(){const n=$('#nc').value.trim();if(n){S.cats.push({id:'c'+Date.now(),n});save();adm()}},
adda(){const n=$('#na').value.trim();if(n){S.adds.push({n,p:+$('#nap').value||0});save();adm()}},
addf(){const b=$('#fb').value.trim();if(b){S.cfg.fees[b]=+$('#fv').value||0;save();adm()}},delf(d){delete S.cfg.fees[d.k];save();adm()},
addcp(){const c=$('#cc').value.trim().toUpperCase();if(!c)return;S.coupons.push({code:c,pct:+$('#cpc').value||0,fix:+$('#cf').value||0,min:+$('#cm').value||0,from:$('#ci').value,to:$('#ct').value,limit:+$('#cl').value||0,used:0,on:true});save();adm()},
set(t){const d=t.dataset,k=d.ad,id=+d.id,p=S.prods.find(x=>x.id==id);
if(k=='price')p.price=+t.value||0;else if(k=='promo')p.promo=+t.value||0;else if(k=='on'||k=='best')p[k]=t.checked;
else if(k=='cfg'){const n=['min','free','radius'].includes(d.k);S.cfg[d.k]=n?+t.value:t.value}
else if(k=='h'){const h=S.cfg.hours,i=+d.i;const v=[...(h[i]||['',''])];v[+d.j]=t.value;h[i]=v[0]&&v[1]?v:null}
else if(k=='cpon')S.coupons[+d.i].on=t.checked;save()}};
function route(){if(location.hash=='#admin')adm();else{$('#adm').hidden=true}}
addEventListener('hashchange',route);
addEventListener('storage',e=>{if(e.key==K){try{const n=JSON.parse(e.newValue);if(n.orders.length>S.orders.length){n.orders[n.orders.length-1].isNew=1;beep();toast('🔔 Novo pedido!')}S=n;if(auth)adm()}catch(x){}}});
home();route();setInterval(stat,60000);
</script>
</body>
